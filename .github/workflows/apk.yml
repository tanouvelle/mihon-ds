name: Build APK
on:
  push:
    branches: [main, "upgrade/**", "feature/epub-text-pages"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      # Ahead of the build, so a release is never published on a red suite. The suite had been
      # uncompilable since July without anyone noticing, because nothing here ever ran it.
      - name: Run unit tests
        run: ./gradlew :core:archive:testDebugUnitTest :app:testDebugUnitTest
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            core/archive/build/reports/tests/testDebugUnitTest
          retention-days: 7
      # Signed with a real keystore when the secrets are present, so releases update over
      # each other. Without them the build falls back to a per-run generated debug key, which
      # is why every earlier release had to be uninstalled before the next could install.
      # The secret is read through env rather than interpolated into the script, so a few KB
      # of key material never lands on a command line.
      - name: Check for signing secrets
        id: signing
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing keystore configured; this build cannot update an installed release."
          fi

      - name: Build APK
        env:
          MIHON_GITHUB_RELEASE: ${{ steps.signing.outputs.available }}
          storeFileBase64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          storePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyAlias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assemblePreview
      - name: Read version and release number
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(grep -m1 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Release counter, independent of github.run_number (which counts every CI run on
          # every branch). Take the highest existing rN tag and add one, so deleting old
          # releases cannot make the counter go backwards onto a tag that still exists.
          LAST=$(gh api "repos/${{ github.repository }}/tags?per_page=100" --jq \
            '[.[].name | capture("-r(?<n>[0-9]+)$") | .n | tonumber] | max // 0' 2>/dev/null || echo 0)
          echo "release=$((LAST + 1))" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION, release: $((LAST + 1))"

      - name: Collect APK
        run: |
          set -e
          ls -R app/build/outputs/apk
          mkdir -p out
          cp app/build/outputs/apk/preview/*universal*.apk \
            "out/mihon-ds-${{ steps.version.outputs.version }}-universal.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: mihon-ds-apk
          path: out/*.apk

      # Releases are cut from main only; upgrade/** branches build artifacts and stop there.
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.version.outputs.version }}-r${{ steps.version.outputs.release }}
          name: Mihon DS ${{ steps.version.outputs.version }} (release ${{ steps.version.outputs.release }})
          body_path: RELEASE_NOTES.md
          files: out/*.apk
